<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 296" width="1200" height="296" role="img" aria-label="Off the clock: outdoors — Mission Peak, five-plus climbs and counting. Beyond the field — I'm always curious about what's happening beyond my own field. With people — I thrive in rooms where we build something meaningful together.">
  <title>Off the clock — outdoors, curiosity beyond my field, and building with people</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#070B13"/>
      <stop offset="0.55" stop-color="#0A101C"/>
      <stop offset="1" stop-color="#05080E"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3F7BFF" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#3F7BFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3F7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5FD8FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5FD8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#172137" stroke-width="1"/>
    </pattern>
    <linearGradient id="columnRule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24344F" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#24344F"/>
      <stop offset="0.82" stop-color="#24344F"/>
      <stop offset="1" stop-color="#24344F" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="296" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="296" fill="url(#bg)"/>
    <rect width="1200" height="296" fill="url(#grid)" opacity="0.45"/>
    <ellipse cx="1020" cy="10" rx="450" ry="260" fill="url(#glowA)"/>
    <ellipse cx="90" cy="300" rx="400" ry="200" fill="url(#glowB)" opacity="0.6"/>

    <circle cx="80" cy="76.5" r="2.6" fill="#6FE3FF">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="88" y="80" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.7" fill="#6E7E9C">OFF THE CLOCK</text>

    <line x1="400.5" y1="112" x2="400.5" y2="264" stroke="url(#columnRule)"/>
    <line x1="760.5" y1="112" x2="760.5" y2="264" stroke="url(#columnRule)"/>

    <!-- outdoors -->
    <g transform="translate(70 118)" fill="none" stroke="#3D5C96" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 34 L16 12 L24 22 L34 6 L50 34"/>
      <path d="M34 6 L34 34" stroke-opacity="0.35" stroke-dasharray="2 4"/>
      <line x1="0" y1="34" x2="50" y2="34" stroke="#22304A"/>
    </g>
    <circle cx="104" cy="124" r="2.6" fill="#6FE3FF">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="104" cy="124" r="2.6" fill="none" stroke="#6FE3FF">
      <animate attributeName="r" values="2.6;14" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="196" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.4" fill="#6E7E9C">OUTDOORS</text>
    <text x="70" y="228" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#8FB4E8">Mission Peak —</text>
    <text x="70" y="254" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#8FB4E8">five-plus climbs and counting.</text>

    <!-- beyond the field -->
    <g transform="translate(430 118)" fill="none" stroke="#3D5C96" stroke-width="1.4" stroke-linecap="round">
      <circle cx="25" cy="20" r="17"/>
      <circle cx="25" cy="20" r="10.5" stroke="#5B8CFF" stroke-opacity="0.45" stroke-dasharray="3 6">
        <animateTransform attributeName="transform" type="rotate" from="0 25 20" to="360 25 20" dur="40s" repeatCount="indefinite"/>
      </circle>
      <line x1="25" y1="0" x2="25" y2="7"/>
      <line x1="25" y1="33" x2="25" y2="40"/>
      <line x1="5" y1="20" x2="12" y2="20"/>
      <line x1="38" y1="20" x2="45" y2="20"/>
    </g>
    <circle cx="455" cy="138" r="2.4" fill="#6FE3FF">
      <animate attributeName="opacity" values="1;0.35;1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <text x="430" y="196" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.4" fill="#6E7E9C">BEYOND THE FIELD</text>
    <text x="430" y="228" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#8FB4E8">I’m always curious about</text>
    <text x="430" y="254" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#8FB4E8">what’s happening beyond my own field.</text>

    <!-- with people -->
    <g transform="translate(790 118)" fill="none" stroke="#3D5C96" stroke-width="1.4">
      <line x1="8" y1="24" x2="25" y2="10"/>
      <line x1="25" y1="10" x2="43" y2="26"/>
      <line x1="8" y1="24" x2="43" y2="26" stroke-opacity="0.4" stroke-dasharray="2 4"/>
      <circle cx="8" cy="24" r="4.6"/>
      <circle cx="25" cy="10" r="4.6"/>
      <circle cx="43" cy="26" r="4.6"/>
    </g>
    <circle cx="815" cy="128" r="2.2" fill="#6FE3FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="833" cy="144" r="2.2" fill="#5B8CFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="790" y="196" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.4" fill="#6E7E9C">WITH PEOPLE</text>
    <text x="790" y="228" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#8FB4E8">I thrive in rooms where we</text>
    <text x="790" y="254" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#8FB4E8">build something meaningful together.</text>

    <g stroke="#293A58" stroke-width="1.2" stroke-linecap="square" fill="none">
      <path d="M26 48V26h22"/>
      <path d="M1174 248v22h-22"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="295" rx="23.5" fill="none" stroke="#1E2A42"/>
</svg>
