<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Core stack: languages Python, TypeScript, JavaScript and SQL; frontend React, HTML and CSS; backend FastAPI, Express.js, PostgreSQL, MySQL and Supabase; AI and machine learning PyTorch, OpenCV, computer vision and deep learning; hardware and edge NVIDIA Jetson, Raspberry Pi, Google Coral and robotics; cloud and tools AWS, Docker, Git and GitHub.">
  <title>Core stack — languages, frontend, backend, AI/ML, hardware and edge, cloud and tools</title>
  <defs>
